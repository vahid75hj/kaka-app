name: kaka_sms
description: Declarative, data-driven bank SMS parser for Kaka. Parsers are JSON templates, not code.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.7
  kaka_domain:
    path: ../kaka_domain
  shamsi_date: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

flutter:
  assets:
    - assets/sms-parsers.v1.json
