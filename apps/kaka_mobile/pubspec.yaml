name: kaka_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.5.3+8

resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  intl: ^0.20.3
  kaka_ai:
    path: ../../packages/kaka_ai
  kaka_data:
    path: ../../packages/kaka_data
  kaka_domain:
    path: ../../packages/kaka_domain
  kaka_sms:
    path: ../../packages/kaka_sms
  kaka_tools:
    path: ../../packages/kaka_tools
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  shamsi_date: ^1.1.1
  share_plus: ^13.3.1
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
