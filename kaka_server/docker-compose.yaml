services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kaka
      POSTGRES_PASSWORD: "6iGIRlaRtmth3dqaJRI5YtsnOFHUD7ng"
    volumes:
      - kaka_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "jhMcr-q0TVHC8iV5GPvI7Czxk5v_K3BF"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kaka_test
      POSTGRES_PASSWORD: "cqCgHsjiWp8LL_2nB3-1iO6Zh8jmCXui"
    volumes:
      - kaka_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "Bz4mNZh0Xvbt3YdlB1SFA-TL3v2n8k66"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  kaka_data:
  kaka_test_data:
