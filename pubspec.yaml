name: kaka_workspace
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/kaka_domain
  - packages/kaka_data
  - packages/kaka_tools
  - packages/kaka_sms
  - packages/kaka_ai
  - apps/kaka_mobile
  - tools/kaka_mcp

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    analyze: melos exec -- dart analyze --fatal-infos .
    test:dart:
      run: melos exec --no-flutter -- dart test
      packageFilters:
        dirExists: test
    test:flutter:
      run: melos exec --flutter -- flutter test
      packageFilters:
        dirExists: test

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
