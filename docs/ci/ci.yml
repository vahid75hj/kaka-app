name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # Pure Dart packages. kaka_sms also runs every catalog entry's `tests`
      # (sms_parser_test.dart), so a broken bank template fails CI.
      - name: Test packages
        run: |
          for p in packages/*/; do
            if [ -d "$p/test" ]; then
              echo "::group::$p"
              (cd "$p" && dart test) || exit 1
              echo "::endgroup::"
            fi
          done

      - name: Test app
        working-directory: apps/kaka_mobile
        run: flutter test
